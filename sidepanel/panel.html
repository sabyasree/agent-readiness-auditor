<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-Readiness Auditor</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#2F4BD0"/>
        <path d="M8 12V8h4M20 8h4v4M24 20v4h-4M12 24H8v-4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.5 12.5l8 3.2-3.4 1.2-1.3 3.5z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Agent-Readiness</span>
        <span class="brand-page" id="pageLabel">Audit the page you’re on</span>
      </div>
    </div>
    <button id="runBtn" class="btn btn-primary" type="button">Run audit</button>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>
  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="panel.js"></script>
</body>
</html>
